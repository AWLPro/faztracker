name: GitHub Pages Yayınla

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri Yükle ve Derle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Pages Ayarla
        uses: actions/configure-pages@v5

      - name: Çıktıyı Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
